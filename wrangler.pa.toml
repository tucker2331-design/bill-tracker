# Pennsylvania's site — a SEPARATE Worker from Virginia's (owner 2026-11-01): its own name/address, its own D1
# database, its own secrets, its own spreadsheet. Same code (worker/index.js + the SPA built with VITE_STATE=PA).
#
# Build:   npm run build:pa          (writes ./dist-pa)
# Deploy:  npx wrangler deploy --config wrangler.pa.toml
# Owner-only setup (passwords/accounts) is listed in docs/architecture/multi_state_config.md → "Pennsylvania site".
name = "bill-tracker-pa"
compatibility_date = "2025-01-01"
main = "worker/index.js"

[assets]
directory = "./dist-pa"
not_found_handling = "single-page-application"
binding = "ASSETS"

[vars]
# Same Google sign-in client as Virginia (the Worker checks the token's audience against it). If you create a
# separate OAuth client for PA, put its id here AND in web/src/config.ts GOOGLE_CLIENT_ID for the PA build.
GOOGLE_CLIENT_ID = "831223695835-cqd2fmjq3l61jc1t6pr9elobra0imhf5.apps.googleusercontent.com"
# "PA · Live" (owner, 2026-11-01) -- the sheet pa_bill_tracker.yml writes to. An identifier, not a credential.
SPREADSHEET_ID = "1ubknsyuzd0Oxl1t9t5FebcNa26zZzCqBnW-N_-sfaAg"
BILL_TRACKER_STATE = "PA"

[[d1_databases]]
binding = "DB"
database_name = "bill-tracker-pa-db"
# D1 — created 2026-11-01, region ENAM. `database_id` is an identifier, not a credential.
database_id = "44bae9f4-a21c-43f2-9585-50d1a825e730"

[triggers]
crons = ["*/15 * * * *"]
