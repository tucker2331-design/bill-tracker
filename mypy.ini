# Type checking — STAGED ADOPTION (docs/workflow/reviewer_strategy.md).
#
# Scoped deliberately to the NEW, self-contained modules. The workers (calendar_worker.py ~8k lines,
# bill_tracker.py) are old and untyped; a type checker aimed at them today emits hundreds of findings, and a
# check nobody reads is a check that gets muted — which is worse than not running it. These modules are new,
# small, and where the next code lands, so the check is meaningful from day one.
#
# WIDEN THE SCOPE as the debt is paid — never by relaxing the settings below.
# (tools/ as a whole is not checkable yet: it contains two different prune.py files, which mypy reads as
# duplicate modules. Fixing that is packaging work, not type work, so it is not a prerequisite here.)
[mypy]
python_version = 3.10
# third-party packages we do not control and that ship no stubs (gspread, etc.)
ignore_missing_imports = True
# a stale `# type: ignore` is itself drift
warn_unused_ignores = True
warn_redundant_casts = True
# dead branches are a real bug class in this codebase
warn_unreachable = True
# an implicit Optional is how None-handling bugs start
no_implicit_optional = True
# check function bodies even where signatures are not annotated yet
check_untyped_defs = True
show_error_codes = True
