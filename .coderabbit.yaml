# CodeRabbit — AI PR review for the VA Legislative Bill Tracker.
# Free for public repos. Replaces Gemini Code Assist (sunsetting ~2026-07-17) and pairs with
# Codex (chatgpt-codex-connector) for two-independent-reviewer coverage on every PR.
# Schema: https://docs.coderabbit.ai/reference/configuration
language: en-US
early_access: false
reviews:
  profile: assertive               # thorough — matches the project's bank-grade-reliability bar
  request_changes_workflow: false
  high_level_summary: false        # speed: skip the summary/walkthrough generation, go to comments
  review_status: true
  poem: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  # The docs/ Obsidian vault is prose (the project "brain"), not code — don't review it as code.
  path_filters:
    - "!docs/**"
  path_instructions:
    - path: "**/*.py"
      instructions: >-
        Prioritize CORRECTNESS and RUNTIME bugs, not only style/security — this is the lens to
        cover. Hunt specifically: None/NaN/pd.NA handling (str(None) -> 'None', boolean-of-NA
        TypeErrors, `x or ''` on nullable fields); pandas pitfalls (iterrows on large frames,
        missing-column KeyErrors, dtype/NA surprises); external-API limits (gspread.update does
        NOT auto-expand the grid -> "exceeds grid limits"; Google Sheets / LIS rate limits;
        empty or partial API/CSV responses); FAIL-SAFES (never overwrite good data with empty on
        a transient fetch failure); type confusion, off-by-one, and silent drops. Treat a
        crash-on-edge-input or a data-integrity regression as HIGH priority. Bank-grade
        reliability, no silent failures.
    - path: "calendar_worker.py"
      instructions: >-
        Bank-grade reliability. Flag any silent failure: a bare `except: pass`, or a bare
        `continue`/fallback without a categorized alert/counter. Enforce Standard #3 — NO text
        parsing on the lobbyist-facing path; classification must be structural (LIS API codes /
        refids), text only for internal diagnostics. Any NEW path that calls `lis.virginia.gov`
        or the `lisfiles` blobs must respect the authorization rule (2025/2026 session codes
        only) and the LIS-safety guardrails (conditional fetch, jitter, the per-cycle request
        cap). Watch for accuracy regressions in the calendar output and in the circuit-breaker
        inputs (meeting_unsourced, rows_appended, invariant_violations, the Y2/Y3 baselines).
    - path: "structural_router.py"
      instructions: >-
        Single source of truth for action classification, imported by the worker AND the
        verification tools. Changes here must keep the worker and tools in lockstep; no
        VA/English-specific assumptions that wouldn't scale to 50 states.
    - path: "tools/verification/**"
      instructions: >-
        Verification/test scripts. Confirm each actually asserts the invariant in its name and
        fails LOUDLY (non-zero exit / explicit failure), never silently passes.
chat:
  auto_reply: true
