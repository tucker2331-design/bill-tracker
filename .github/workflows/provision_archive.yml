name: 🆕 Provision Next Archive Workbook

# Creates the NEXT session-archive workbook, shares it with the owner, and records it in
# the registry cell the worker reads. Needs Drive scope + the Drive API enabled (the
# tool's error message says how if not). See tools/session_archive/provision_archive.py.
#   mode=test     -> create a throwaway book, share, print URL, DELETE it (capability check)
#   mode=provision-> create the real next book + write it to the registry
# Shares the calendar-worker concurrency group so it never races a worker write.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test (throwaway capability check) or provision (create the real next book)"
        type: choice
        default: "test"
        options:
          - test
          - provision
      archive_name:
        description: "name for the new book (provision mode)"
        type: string
        default: "Mastermind Archive 2"

concurrency:
  group: calendar-worker
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth
      - name: Provision archive workbook (${{ inputs.mode }})
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          MODE: ${{ inputs.mode }}
          ARCHIVE_NAME: ${{ inputs.archive_name }}
        run: python3 tools/session_archive/provision_archive.py
