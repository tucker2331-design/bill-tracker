name: 🤖 Mastermind Ghost Worker 2

on:
  schedule:
    # LIS-safety guardrail #5 (activity-correlated cadence): fire FAST but SELF-THROTTLE in the worker.
    # The 15-min cron only OFFERS a tick; calendar_worker.py __main__ then reads the cadence-state cell
    # (Sheet1!AC1) and decides whether this tick does real work:
    #   • IN_WINDOW (a real meeting is happening now) → run every tick (~15-19 min) to catch votes/reports
    #     within minutes — the freshness lobbyists actually need.
    #   • IDLE (meetings on the forward calendar, none active now) → ~hourly.
    #   • EMPTY (nothing scheduled ahead) → ~3h, the old conservative baseline.
    # Load tracks the legislature, not the clock (Standard #8). Off-window ticks EXIT IN SECONDS after one
    # Sheets read (ZERO LIS), so the old "15-min cron backs up because runtime is ~19 min" problem is gone
    # — full runs only queue IN a meeting window, where back-to-back ~19-min cycles ARE the intent and the
    # concurrency lock (below) serializes them safely. Quiet hours (11pm-6am ET) + jitter still apply to
    # scheduled runs; manual dispatch / Backfill Burst bypass all gates. See docs/knowledge/lis_api_safety.md.
    - cron: '*/15 * * * *' # every 15 min (UTC); the worker self-throttles per guardrail #5 (AC1)
  workflow_dispatch: # Adds a manual "Run Now" button (bypasses quiet hours + cadence gate)

# PR-C1: queue overlapping cycles rather than parallelizing them. If a cycle
# N is still running when cycle N+1 fires (e.g. GitHub Actions is slow and
# the 15-min run took 18 min), N+1 waits for N to finish. `cancel-in-progress:
# false` means we NEVER cancel a mid-flight cycle — losing work mid-cycle
# would leave Sheet1 in a half-written state, which is worse than queuing.
# The 15-min cron is tight enough that queued cycles still complete within
# a reasonable window; a truly stuck cycle would need separate alerting
# (GitHub Actions surfaces runtime > threshold natively).
concurrency:
  group: calendar-worker
  cancel-in-progress: false

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread google-auth pandas beautifulsoup4 pdfplumber

      # LIS-safety guardrail #1: persist the conditional-fetch blob cache across runs so
      # If-None-Match can return 304 and skip re-downloading unchanged blobs (the 4.7 MB
      # HISTORY.CSV especially). Unique key + prefix restore-keys = "always save, restore
      # the latest". Pure speed/courtesy; a cache miss just downloads normally. See
      # docs/knowledge/lis_api_safety.md.
      - name: Restore LIS blob cache
        uses: actions/cache@v4
        with:
          path: .lis_blob_cache
          key: lis-blob-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lis-blob-cache-

      - name: Run Backend Worker
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          # Optional ops/bug-alert channel. If this secret is unset, notify_slack
          # is a no-op and the worker runs unchanged (in-sheet SYSTEM_ALERT rows +
          # the GitHub failure email remain the baseline). Set repo secret
          # SLACK_WEBHOOK_URL to a Slack Incoming Webhook URL to activate.
          # See docs/architecture/alerting.md.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Incremental-STM SHADOW validation (observe-only). Set repo VARIABLE
          # STM_INCREMENTAL_SHADOW="1" to validate, on the real production cycles, that
          # reusing unchanged bills' cached events == the full run (it never changes the
          # output — just logs MATCH and raises a CRITICAL on any divergence). Runs ON the
          # production worker (no extra cycle, no extra LIS load) for a validation window,
          # then unset before the flip to incremental-primary. Off when the var is unset.
          STM_INCREMENTAL_SHADOW: ${{ vars.STM_INCREMENTAL_SHADOW }}
        run: python calendar_worker.py
