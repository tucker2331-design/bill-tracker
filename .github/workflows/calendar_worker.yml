name: 🤖 Mastermind Ghost Worker 2

on:
  schedule:
    # PR-C7.1f: every 3 hours (was every 15 min). Two reasons:
    #   1. Runtime is ~16-19 min, so a 15-min cron structurally backs up —
    #      runs queue behind each other (concurrency: calendar-worker,
    #      cancel-in-progress: false) and GitHub deprioritizes/skips
    #      scheduled fires under a growing backlog. 3h >> 19min, no pile-up.
    #   2. VA GA is adjourned (off-season) + pre-launch — frequent runs are
    #      wasted LIS API exposure (ban risk) with no new HISTORY to scrape.
    # The worker ALSO self-gates overnight (quiet hours 11pm-6am ET, in
    # calendar_worker.py __main__) for scheduled runs only — manual dispatch
    # and the Backfill Burst always run.
    # LIVE-SESSION NOTE: when the 2027 session opens, bump this up for
    # fresher data — but to ~30 min (fits the ~19-min runtime), NOT 15 min.
    - cron: '0 */3 * * *' # every 3 hours, on the hour (UTC)
  workflow_dispatch: # Adds a manual "Run Now" button (bypasses quiet hours)

# PR-C1: queue overlapping cycles rather than parallelizing them. If a cycle
# N is still running when cycle N+1 fires (e.g. GitHub Actions is slow and
# the 15-min run took 18 min), N+1 waits for N to finish. `cancel-in-progress:
# false` means we NEVER cancel a mid-flight cycle — losing work mid-cycle
# would leave Sheet1 in a half-written state, which is worse than queuing.
# The 15-min cron is tight enough that queued cycles still complete within
# a reasonable window; a truly stuck cycle would need separate alerting
# (GitHub Actions surfaces runtime > threshold natively).
concurrency:
  group: calendar-worker
  cancel-in-progress: false

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread google-auth pandas beautifulsoup4 pdfplumber

      - name: Run Backend Worker
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python calendar_worker.py
