name: 🎬 STM Replay Sim (day-by-day 2026 validation)

# The strongest pre-2027 validation of the incremental STM: runs ONE normal worker
# cycle, then replays the FULL 2026 session DAY BY DAY entirely in memory (slicing the
# already-downloaded HISTORY), proving incremental==full at every step on real in-season
# deltas. The STM is cache-lookup-only (ZERO network), so the replay makes NO LIS calls —
# the only LIS contact is the single normal cycle's fetches. Manual only; runs for ~hours
# in the background. On any divergence it raises a CRITICAL alert. See alerting.md.

on:
  workflow_dispatch:

concurrency:
  group: calendar-worker          # share the worker lock — never overlaps a real cycle
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # the day-by-day replay re-runs the full STM ~90 times
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread google-auth pandas beautifulsoup4 pdfplumber
      - name: Run worker + day-by-day replay sim
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STM_REPLAY_SIM: "1"
        run: python calendar_worker.py
