name: CA bill tracker (California site)

# California's own job: the CA intake (states/ca_*) written to CA's OWN spreadsheet (CA_SPREADSHEET_ID).
# Fetch rules: Legislative Counsel's pubinfo bulk files only (the interactive leginfo site is never fetched), streamed
# to disk, at most once per URL per 20 h, honest UA, stop on 401/403/429. pubinfo is published daily (~21:20 Pacific);
# the session file is rebuilt each Sunday.
# Daily (the source publishes once a day; every speed in cadence_profiles.json is daily for CA). 06:41 UTC is after
# Legislative Counsel's ~21:20 Pacific publication. The sheet id is read from wrangler.ca.toml (not a secret).
# NOT part of Virginia's trust surface: trust_surface_guard.OTHER_STATE_JOBS lists it.
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "write = production write; dry-run = fetch + build only"
        default: dry-run
        type: choice
        options: [dry-run, write]

permissions:
  contents: read      # least-privilege: the token only checks out the code; sheet writes use GCP_CREDENTIALS
                      # (declared so the repo-default setting cannot change this job: going_private §C)

concurrency:
  group: ca-bill-tracker
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install --quiet gspread google-auth pytz pyyaml
      # Committee rosters: Open States' people data for California (public domain, CC0) — a plain git checkout of
      # data/ca only; no API, no key. A failed checkout never holds back the bills (roster_status says why).
      - name: Check out Open States people data (California)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: openstates/people
          path: .openstates_people
          sparse-checkout: data/ca
          fetch-depth: 1
      - name: Restore the fetch cache (keeps the 20 h cap across runs)
        uses: actions/cache@v4
        with:
          path: .ca_cache
          key: ca-fetch-${{ github.run_id }}
          restore-keys: ca-fetch-
      - name: Run the CA intake
        env:
          PYTHONUNBUFFERED: "1"
          CA_CACHE_DIR: .ca_cache
          CA_PEOPLE_DIR: .openstates_people/data/ca
          CA_SPREADSHEET_ID: ${{ secrets.CA_SPREADSHEET_ID }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "write" ]; then
            python3 ca_bill_tracker.py
          else
            python3 ca_bill_tracker.py --dry-run
          fi
