name: 🛡️ Accuracy Sentinel (Section 9 + unclassified guard)

# Standard #2/#8: the CONTINUOUS, SESSION-AGNOSTIC guardian of calendar accuracy.
# A one-time audit can't protect next session's NEW data — this runs the same
# accuracy metric the X-Ray Section 9 uses, against the LIVE sheet, daily, and
# FAILS LOUDLY on any regression (Section 9 > 0, unclassified > 0, a collapsed/
# partial sheet, or over-derivation). Reads the live sheet via public gviz CSV —
# NO secrets. Runs in 2027 unchanged.

on:
  workflow_dispatch:
  # Run IMMEDIATELY after every worker cycle so an accuracy regression is caught on the
  # data that just landed — not up to a day later (the "cleaning crew in line after the
  # worker"). The daily cron stays as a backstop in case the worker doesn't run.
  workflow_run:
    workflows: ["🤖 Mastermind Ghost Worker 2"]
    types: [completed]
  schedule:
    - cron: "0 12 * * *"   # daily 12:00 UTC (backstop)

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Accuracy invariants (Section 9 / unclassified / floor / derived)
        run: python3 tools/verification/accuracy_sentinel.py
