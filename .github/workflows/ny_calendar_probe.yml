name: New York Calendar Probe

# Manual read-only source probe for NY calendar candidates. This workflow does
# not receive Google Sheets credentials and must never write product output.
on:
  workflow_dispatch:
    inputs:
      sources:
        description: "openleg | assembly | openleg,assembly"
        required: true
        default: "openleg,assembly"
      from_date:
        description: "Inclusive probe start date, YYYY-MM-DD"
        required: true
        default: "2026-01-01"
      to_date:
        description: "Exclusive probe end date, YYYY-MM-DD"
        required: true
        default: "2026-02-01"
      detail_limit:
        description: "Assembly detail pages to sample from each index; 0 for index-only"
        required: true
        default: "3"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  ny-calendar-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ny.txt

      - name: Check probe runtime configuration
        env:
          NY_OPENLEG_API_KEY: ${{ secrets.NY_OPENLEG_API_KEY }}
        run: python ny_calendar_probe.py --check-config --sources "${{ inputs.sources }}"

      - name: Run read-only calendar probe
        env:
          NY_OPENLEG_API_KEY: ${{ secrets.NY_OPENLEG_API_KEY }}
        run: |
          mkdir -p artifacts
          python ny_calendar_probe.py \
            --sources "${{ inputs.sources }}" \
            --from-date "${{ inputs.from_date }}" \
            --to-date "${{ inputs.to_date }}" \
            --detail-limit "${{ inputs.detail_limit }}" \
            --output artifacts/ny-calendar-probe.json

      - name: Upload probe JSON
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ny-calendar-probe-${{ inputs.sources }}-${{ inputs.from_date }}-${{ inputs.to_date }}
          path: artifacts/ny-calendar-probe.json
          if-no-files-found: error
          retention-days: 30
