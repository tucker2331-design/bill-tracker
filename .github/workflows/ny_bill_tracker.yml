name: New York Bill Tracker

# Daily production run after full dry-run, first write, owner spot check, and
# automated read-back validation passed on 2026-06-24. Manual dispatch remains
# available for config checks, dry runs, and controlled writes.
on:
  schedule:
    # Once daily at 17:40 UTC. Keep off the top of the hour to avoid common
    # GitHub Actions congestion windows; revisit after the frontend is live.
    - cron: "40 17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check-config | dry-run | write"
        required: true
        default: "check-config"
        type: choice
        options:
          - check-config
          - dry-run
          - write
      session_year:
        description: "NY OpenLeg session year, e.g. 2025 for 2025-2026"
        required: true
        default: "2025"
      max_pages:
        description: "Optional page cap for probes; leave blank for full session"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Serialize production writes, but do not let manual check-config/dry-run
  # probes queue ahead of the daily refresh.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'write' || github.event_name == 'workflow_dispatch' && inputs.mode == 'write' && 'write' || github.run_id }}
  cancel-in-progress: false

jobs:
  ny-bill-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Refuse production write outside main
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'write' && github.ref != 'refs/heads/main' }}
        run: |
          echo "Production NY writes are only allowed from refs/heads/main."
          exit 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ny.txt

      - name: Check runtime configuration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'check-config' }}
        env:
          NY_OPENLEG_API_KEY: ${{ secrets.NY_OPENLEG_API_KEY }}
          NY_SPREADSHEET_ID: ${{ secrets.NY_SPREADSHEET_ID }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python ny_bill_tracker.py --check-config

      - name: Dry-run New York bill tracker
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' }}
        env:
          NY_OPENLEG_API_KEY: ${{ secrets.NY_OPENLEG_API_KEY }}
          NY_OPENLEG_SESSION_YEAR: ${{ inputs.session_year }}
          NY_OPENLEG_MAX_PAGES: ${{ inputs.max_pages }}
        run: python ny_bill_tracker.py --dry-run

      - name: Write New York bill tracker
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'write')) }}
        env:
          NY_OPENLEG_API_KEY: ${{ secrets.NY_OPENLEG_API_KEY }}
          NY_SPREADSHEET_ID: ${{ secrets.NY_SPREADSHEET_ID }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          NY_OPENLEG_SESSION_YEAR: ${{ github.event_name == 'workflow_dispatch' && inputs.session_year || '2025' }}
          NY_OPENLEG_MAX_PAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_pages || '' }}
        run: python ny_bill_tracker.py
