name: ✅ Structural Tests (golden + drift guards)

# The repo's structural golden tests had no CI runner — they only caught regressions if a
# human remembered to run them locally. This gate runs them automatically on every PR (and on
# pushes to main), so a structural regression — a misrouted EventCode, a broken refid class, or
# the producer/validator Origin drift that caused the persistent false invariant_violations=1
# (#176) — fails the check instead of shipping silently.
#
# Pure static / in-memory: structural_router is stdlib-only and the Origin drift test just parses
# calendar_worker.py with `ast`. NO pip install, NO Google/LIS credentials, NO network — seconds to run.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # B-3: the mechanical half of the 15-point pre-push audit — enforces what a bot caught on #189 a PR late
  # (an output-value change with no WORKER_OUTPUT_LOGIC_VERSION bump). Stdlib-only, so it rides the fast lane.
  prepush-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the base ref for the diff
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pyflakes (undefined-name gate, audit #105)
        run: python3 -m pip install --quiet "pyflakes==3.4.0"  # pinned: the audit matches message wording (CodeRabbit #214)
      - name: Machine pre-push audit (mechanical 15-point subset)
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch -q origin "${{ github.base_ref }}"
            python3 tools/prepush_audit.py --base "origin/${{ github.base_ref }}"
          else
            python3 tools/prepush_audit.py --range HEAD~1..HEAD
          fi

  # The FRONTEND BUILD — the exact command Cloudflare runs on deploy (`tsc -b && vite build`).
  # WHY THIS JOB EXISTS (added 2026-07-26): PR #227 had three green CI checks while the Cloudflare
  # "Workers Builds" check FAILED on a real TypeScript error, so the fix silently never reached the live
  # site and the owner refreshed a stale page. Nothing in CI compiled `web/` at all — `tsc -b` (project
  # build) also catches errors a bare `tsc --noEmit` can miss. Deploy-blocking failures must surface HERE,
  # in the repo's own checks, not only in the host's dashboard after merge.
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (clean, lockfile-exact)
        run: npm ci --prefix web
      - name: Build exactly as the deploy does
        run: npm run build --prefix web

  structural-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run structural golden + drift tests
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -u
          fail=0
          for t in \
            test_origin_registry_sync.py \
            test_route_event.py \
            test_classify_action.py \
            test_classify_refid.py \
            test_classify_schedule_type.py \
            test_governor_eventcode_drift.py; do
            echo "::group::$t"
            if python3 -u "$t"; then echo "PASS  $t"; else echo "FAIL  $t"; fail=1; fi
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then echo "::error::one or more structural tests failed"; fi
          exit $fail
