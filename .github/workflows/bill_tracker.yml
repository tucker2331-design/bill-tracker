name: 🗂️ Bill Tracker

# The new lobbyist-product backend (bill_tracker.py). Writes the Bill_Tracker tab the React/Vite
# front end reads via gviz. See product_roadmap §B0.
#
# SCHEDULE — ban-safe by design (the owner is, rightly, ban-averse), ACTIVITY-CORRELATED (guardrail #5),
# EQUALIZED with the calendar worker in-window (owner 2026-07-05):
#   - cron '*/15 * * * *' = every 15 min at :00/:15/:30/:45. This only OFFERS a tick; bill_tracker.py
#     (_scheduled_gate → _cadence_should_run) self-throttles against the SHARED meeting signal (Sheet1!AC1,
#     maintained by the calendar worker) + this worker's own last-run marker (Bill_Tracker!U1):
#       • meeting ACTIVE  → run every ~15 min, the SAME track as the calendar worker (floor votes / committee
#         report outcomes post DURING a meeting and are as time-sensitive as the calendar itself).
#       • meeting on the forward calendar but not now → ~hourly.
#       • forward calendar EMPTY (off-season, static data) → ~6h, the conservative baseline.
#     Cadence rises with legislative activity and falls to 6h when quiet — no seasonal cron edits (Standard #8).
#   - OWN concurrency group (NOT the calendar lock anymore). Rationale: the calendar worker runs back-to-back
#     ~19-min cycles IN a meeting window, so sharing its lock would STARVE this worker (it could never reach
#     the 15-min track the owner wants). Running the two in parallel is still ban-safe: this is a LIGHT job
#     (~5 guarded LIS reads, mostly 304s), both workers share the .lis_blob_cache (guardrail #1 → the 4.7 MB
#     HISTORY isn't double-downloaded even when they overlap), both jitter 0–180s (never the same instant),
#     both honor the per-cycle request cap (#4), and each runs on a DIFFERENT GitHub runner IP. Two light,
#     jittered, conditional, capped consumers ≈ one analyst with a couple of tabs open — not a ban pattern.
#     cancel-in-progress:false so this worker never overlaps ITSELF (a slow cycle isn't cut off mid-write).
#   - Off-window ticks EXIT after a Sheets read (ZERO LIS). Manual dispatch bypasses every gate (immediate).
on:
  schedule:
    - cron: '*/15 * * * *'        # every 15 min; the worker self-throttles per guardrail #5 (AC1 + U1)
  workflow_dispatch:              # manual "Run Now" — bypasses quiet hours + cadence + jitter

permissions:
  contents: read                  # least-privilege (CodeRabbit #163): only needs checkout; writes go to
                                  # Google Sheets via GCP_CREDENTIALS, not the GITHUB_TOKEN

concurrency:
  group: bill-tracker             # OWN lock (was calendar-worker) so calendar's in-window cycles don't starve
  cancel-in-progress: false       # this worker; still never overlaps ITSELF. Ban-safety rationale above.

jobs:
  bill-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread google-auth pandas pytz beautifulsoup4 pdfplumber
      - name: Restore LIS blob cache
        uses: actions/cache@v4
        with:
          path: .lis_blob_cache
          key: lis-blob-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lis-blob-cache-
      - name: Run bill tracker
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python bill_tracker.py
