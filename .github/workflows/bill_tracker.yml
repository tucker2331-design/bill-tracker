name: 🗂️ Bill Tracker

# The new lobbyist-product backend (bill_tracker.py). Writes the Bill_Tracker tab the React/Vite
# front end reads via gviz. See product_roadmap §B0.
#
# SCHEDULE — ban-safe by design (the owner is, rightly, ban-averse):
#   - cron '40 */6 * * *' = every 6 hours at :40 UTC. Conservative: this is a LIGHT job (~5 guarded
#     LIS reads, mostly 304 cache hits) but the bill data only regenerates ~daily (the LIS blobs
#     refresh ~16:00 GMT) and the GA is adjourned (off-season → static data), so 4×/day is plenty.
#     :40 is OFF the congested top-of-hour AND off the calendar worker's :00 slot.
#   - The job ALSO self-gates in bill_tracker.py (_scheduled_gate): skips 11pm–6am ET quiet hours and
#     jitters 0–180s — so scheduled runs are decorrelated from the cron tick and avoid overnight
#     exposure. Manual dispatch bypasses the gate (immediate).
#   - LIVE-SESSION NOTE (2027): bump the cadence for fresher data — e.g. '40 */2 * * *' (every 2h);
#     it stays ban-safe (conditional fetch + the worker's per-cycle request cap + the shared lock).
on:
  schedule:
    - cron: '40 */6 * * *'        # every 6 hours at :40 UTC (off-season-conservative; see notes above)
  workflow_dispatch:              # manual "Run Now" — bypasses quiet hours + jitter

permissions:
  contents: read                  # least-privilege (CodeRabbit #163): only needs checkout; writes go to
                                  # Google Sheets via GCP_CREDENTIALS, not the GITHUB_TOKEN

concurrency:
  group: calendar-worker          # share the worker lock — never overlap a calendar cycle's LIS use
  cancel-in-progress: false

jobs:
  bill-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread google-auth pandas pytz beautifulsoup4 pdfplumber
      - name: Restore LIS blob cache
        uses: actions/cache@v4
        with:
          path: .lis_blob_cache
          key: lis-blob-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lis-blob-cache-
      - name: Run bill tracker
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python bill_tracker.py
