name: 🗂️ Bill Tracker

# The new lobbyist-product backend (bill_tracker.py). Writes the Bill_Tracker tab the React/Vite
# front end reads via gviz. See product_roadmap §B0.
#
# SCHEDULE — ban-safe by design (the owner is, rightly, ban-averse), now ACTIVITY-CORRELATED (guardrail #5):
#   - cron '40 * * * *' = hourly at :40 UTC. This only OFFERS a tick; bill_tracker.py (_scheduled_gate →
#     _cadence_should_run) then self-throttles against the SHARED meeting signal (Sheet1!AC1, maintained by
#     the calendar worker) + this worker's own last-run marker (Bill_Tracker!U1):
#       • meeting active / on the forward calendar → run hourly (fresher patron/outcome/floor data while the
#         GA is actually moving bills).
#       • forward calendar empty (off-season, static data) → ~6h, the old conservative baseline.
#     Cadence rises with legislative activity and falls to 6h when quiet — no seasonal cron edits (Standard
#     #8). :40 stays OFF the congested top-of-hour AND off the calendar worker's :00/:15/:30/:45 slots.
#   - Still ban-safe: LIGHT job (~5 guarded LIS reads, mostly 304s), conditional fetch (#1) + per-cycle
#     request cap (#4) + the SHARED calendar-worker concurrency lock (never overlaps a calendar cycle's LIS
#     use) + jitter (#2) + quiet hours (11pm–6am ET). Off-window ticks EXIT after a Sheets read (ZERO LIS).
#     Manual dispatch bypasses every gate (immediate).
on:
  schedule:
    - cron: '40 * * * *'          # hourly at :40 UTC; the worker self-throttles per guardrail #5 (AC1 + U1)
  workflow_dispatch:              # manual "Run Now" — bypasses quiet hours + cadence + jitter

permissions:
  contents: read                  # least-privilege (CodeRabbit #163): only needs checkout; writes go to
                                  # Google Sheets via GCP_CREDENTIALS, not the GITHUB_TOKEN

concurrency:
  group: calendar-worker          # share the worker lock — never overlap a calendar cycle's LIS use
  cancel-in-progress: false

jobs:
  bill-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread google-auth pandas pytz beautifulsoup4 pdfplumber
      - name: Restore LIS blob cache
        uses: actions/cache@v4
        with:
          path: .lis_blob_cache
          key: lis-blob-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lis-blob-cache-
      - name: Run bill tracker
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python bill_tracker.py
